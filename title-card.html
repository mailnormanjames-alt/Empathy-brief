<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODE IS POETRY — A Look Book Project</title>
  <meta name="description" content="CODE IS POETRY — A LOOK BOOK PROJECT FOR EMPATHY STUDIO BY Norman James. Volume 1.">
  <meta property="og:title" content="CODE IS POETRY — A Look Book Project">
  <meta property="og:description" content="A LOOK BOOK PROJECT FOR EMPATHY STUDIO BY Norman James. Volume 1.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#F0EDE6">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=DM+Mono:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    /* FONT FACE */
    @font-face {
      font-family: 'Brittany';
      src: url('BrittanySignature.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* RESET */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }

    /* CUSTOM PROPERTIES */
    :root {
      --paper: #F0EDE6;
      --ink: #111111;
      --accent: #8B6914;
      --mist: #E8E4DC;
      --ghost: rgba(139,105,20,0.06);
      --line: rgba(17,17,17,0.08);
      --line-light: rgba(240,237,230,0.1);
      --ease: cubic-bezier(0.76, 0, 0.24, 1);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* BODY */
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: 'Source Serif 4', serif;
      font-weight: 400;
      font-size: .8rem;
      letter-spacing: .1em;
      overflow-x: hidden;
      cursor: none;
      transition: background-color 1s ease, color 0.8s ease;
    }
    a { text-decoration: none; color: inherit; cursor: none; }

    /* GRAIN */
    .grain {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 9999;
      opacity: .03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      will-change: transform;
      animation: grainDrift 0.5s steps(5) infinite;
    }
    @keyframes grainDrift {
      0%   { transform: translate3d(0, 0, 0); }
      20%  { transform: translate3d(-3px, 2px, 0); }
      40%  { transform: translate3d(2px, -3px, 0); }
      60%  { transform: translate3d(-2px, 3px, 0); }
      80%  { transform: translate3d(3px, -1px, 0); }
      100% { transform: translate3d(-1px, 2px, 0); }
    }

    /* CURSOR */
    .cursor { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 99999; mix-blend-mode: difference; }
    .cursor-dot { width: 8px; height: 8px; background: var(--paper); border-radius: 50%; position: absolute; will-change: transform; }
    .cursor-ring { width: 32px; height: 32px; border: 1px solid rgba(240,237,230,.35); border-radius: 50%; position: absolute; top: -12px; left: -12px; will-change: transform; transition: all .3s ease; }

    /* LOADER */
    .loader {
      position: fixed; inset: 0;
      background: var(--paper);
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader-line {
      position: absolute;
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      font-size: clamp(.7rem, 1.4vw, 1rem);
      letter-spacing: .55em;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0;
      will-change: opacity;
      white-space: nowrap;
    }
    .loader-by {
      font-size: clamp(.6rem, 1.1vw, .8rem) !important;
      letter-spacing: .3em !important;
      text-transform: lowercase !important;
    }
    .loader-signature {
      position: absolute;
      font-family: 'Brittany', cursive;
      font-weight: 400;
      font-size: clamp(1.2rem, 3vw, 2.2rem);
      color: var(--ink);
      opacity: 0;
      will-change: opacity, clip-path;
      white-space: nowrap;
      clip-path: inset(0 100% 0 0);
    }
    .loader-volume {
      position: absolute;
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      font-size: clamp(.55rem, .9vw, .7rem);
      letter-spacing: .4em;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0;
      will-change: opacity;
    }

    /* MOBILE */
    @media (max-width: 1000px) {
      body { cursor: auto; }
      .cursor { display: none; }
      .footer { flex-direction: column; align-items: flex-start; }
      .footer-right { text-align: left; }
    }
  </style>
</head>
<body>

  <!-- GRAIN -->
  <div class="grain"></div>

  <!-- CURSOR -->
  <div class="cursor">
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>
  </div>

  <!-- LOADER -->
  <div class="loader" id="loader">
    <div class="loader-stage" id="loaderStage">
      <span class="loader-line" id="loaderLine1">CODE IS POETRY</span>
      <span class="loader-line" id="loaderLine2">A LOOK BOOK PROJECT</span>
      <span class="loader-line" id="loaderLine3">FOR EMPATHY STUDIO</span>
      <span class="loader-line loader-by" id="loaderBy">by</span>
      <span class="loader-signature" id="loaderSignature">Norman james</span>
      <span class="loader-volume" id="loaderLine4">VOLUME 1</span>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script>
    // CURSOR
    const cursor = document.querySelector('.cursor');
    const dot = document.querySelector('.cursor-dot');
    const ring = document.querySelector('.cursor-ring');
    let mouseX = 0, mouseY = 0;
    let ringX = 0, ringY = 0;

    document.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      dot.style.transform = `translate3d(${mouseX - 4}px, ${mouseY - 4}px, 0)`;
    });

    function animateRing() {
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;
      ring.style.transform = `translate3d(${ringX - 16}px, ${ringY - 16}px, 0)`;
      requestAnimationFrame(animateRing);
    }
    animateRing();

    // LOADER SEQUENCE
    const loader = document.getElementById('loader');
    const lines = [
      document.getElementById('loaderLine1'),
      document.getElementById('loaderLine2'),
      document.getElementById('loaderLine3'),
      document.getElementById('loaderBy'),
      document.getElementById('loaderSignature')
    ];
    const volumeLine = document.getElementById('loaderLine4');

    let current = 0;
    const showLine = () => {
      if (current >= lines.length) {
        setTimeout(() => {
          lines[lines.length - 1].style.transition = 'opacity 1.4s cubic-bezier(0.22, 1, 0.36, 1), clip-path 1.4s cubic-bezier(0.22, 1, 0.36, 1)';
          lines[lines.length - 1].style.opacity = '0';
          lines[lines.length - 1].style.clipPath = 'inset(0 100% 0 0)';
          setTimeout(() => {
            volumeLine.style.transition = 'opacity 1.4s cubic-bezier(0.22, 1, 0.36, 1)';
            volumeLine.style.opacity = '1';
            setTimeout(() => {
              volumeLine.style.opacity = '0';
              setTimeout(() => {
                loader.style.transition = 'opacity 2s cubic-bezier(0.22, 1, 0.36, 1)';
                loader.style.opacity = '0';
                setTimeout(() => {
                  loader.style.display = 'none';
                }, 2000);
              }, 1200);
            }, 2200);
          }, 1600);
        }, 1500);
        return;
      }
      const line = lines[current];
      if (current < lines.length - 1) {
        line.style.transition = 'opacity 1.4s cubic-bezier(0.22, 1, 0.36, 1)';
        line.style.opacity = '1';
        setTimeout(() => {
          line.style.opacity = '0';
          current++;
          setTimeout(showLine, 600);
        }, current === 0 ? 2400 : 2200);
      } else {
        line.style.transition = 'opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), clip-path 2s cubic-bezier(0.22, 1, 0.36, 1)';
        line.style.opacity = '1';
        line.style.clipPath = 'inset(0 0% 0 0)';
        current++;
        setTimeout(showLine, 2400);
      }
    };
    setTimeout(showLine, 800);

    // SCROLL PROGRESS
    window.addEventListener('scroll', () => {
      const h = document.documentElement;
      const pct = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
      document.documentElement.style.setProperty('--scroll', pct + '%');
    });

    // SMOOTH SCROLL
    const lenis = new Lenis();
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(time => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);

  </script>
</body>
</html>
